<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Your Profile — Opportunity Seeker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../styles/variables.css" />
  <link rel="stylesheet" href="../styles/general.css" />
  <link rel="stylesheet" href="../styles/profile.css" />
</head>
<body class="profile-page">

  <!-- ============ TOP BAR ============ -->
  <header class="profile-topbar">
    <a href="../index.html" class="brand">
      <span class="brand-mark">o-s</span>
      <span class="brand-name">Opportunity Seeker</span>
    </a>
    <a href="../index.html" class="skip-link">Skip for now</a>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="profile-main">

    <div class="profile-heading">
      <h1>Create Your Profile</h1>
      <p>Help us personalize your recommendations</p>
    </div>

    <form id="profile-form" class="profile-form" novalidate>

      <!-- ============ 1. PERSONAL INFO ============ -->
      <section class="form-card">
        <div class="form-card-header">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <h2>Personal Info</h2>
        </div>

        <div class="form-grid form-grid--personal">
          <div class="field">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" type="text" placeholder="e.g., Mesfin Abebe" />
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" />
          </div>

          <div class="field">
            <label for="country">Country</label>
            <select id="country" name="country">
              <option value="">Select country</option>
              <option value="Ethiopia">Ethiopia</option>
              <option value="Kenya">Kenya</option>
              <option value="Nigeria">Nigeria</option>
              <option value="United States">United States</option>
              <option value="United Kingdom">United Kingdom</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="avatar-upload">
            <div class="avatar-preview" id="avatarPreview">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <span class="avatar-plus">+</span>
            </div>
            <button type="button" class="avatar-btn">Upload</button>
          </div>
        </div>
      </section>

      <!-- ============ 2. EDUCATION ============ -->
      <section class="form-card">
        <div class="form-card-header">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </span>
          <h2>Education</h2>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="educationLevel">Level</label>
            <select id="educationLevel" name="educationLevel">
              <option value="">Select level</option>
              <option value="High School">High School</option>
              <option value="Undergraduate">Undergraduate</option>
              <option value="Master's">Master's</option>
              <option value="PhD">PhD</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="fieldOfStudy">Field of study</label>
            <input id="fieldOfStudy" name="fieldOfStudy" type="text" placeholder="e.g., Computer Science" />
          </div>

          <div class="field">
            <label for="institution">Institution</label>
            <input id="institution" name="institution" type="text" placeholder="e.g., Addis Ababa University" />
          </div>

          <div class="field">
            <label for="graduationYear">Expected graduation</label>
            <input id="graduationYear" name="graduationYear" type="text" inputmode="numeric" maxlength="4" placeholder="2026" />
          </div>

          <div class="field field--full">
            <label>Status</label>
            <div class="radio-pills" role="radiogroup" aria-label="Status">
              <label class="pill-radio">
                <input type="radio" name="status" value="Enrolled" checked />
                <span>Enrolled</span>
              </label>
              <label class="pill-radio">
                <input type="radio" name="status" value="Graduated" />
                <span>Graduated</span>
              </label>
              <label class="pill-radio">
                <input type="radio" name="status" value="Not applicable" />
                <span>Not applicable</span>
              </label>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ 3. SKILLS & INTERESTS ============ -->
      <section class="form-card">
        <div class="form-card-header">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 15 8.5 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 9 8.5 12 2"/>
            </svg>
          </span>
          <h2>Skills &amp; Interests</h2>
        </div>

        <div class="tag-input-block">
          <label>Skills</label>
          <div class="tag-input" data-tag-input="skills">
            <div class="tag-list" id="skillsList"></div>
            <input type="text" class="tag-field" placeholder="Add a skill..." data-tag-field />
          </div>
        </div>

        <div class="tag-input-block">
          <label>Interests</label>
          <div class="tag-input" data-tag-input="interests">
            <div class="tag-list" id="interestsList"></div>
            <input type="text" class="tag-field" placeholder="Add an interest..." data-tag-field />
          </div>
        </div>

        <div class="tag-input-block">
          <label>Career goals</label>
          <div class="tag-input" data-tag-input="goals">
            <div class="tag-list" id="goalsList"></div>
            <input type="text" class="tag-field" placeholder="Add a goal..." data-tag-field />
          </div>
        </div>
      </section>

      <!-- ============ 4. WHAT YOU'RE LOOKING FOR ============ -->
      <section class="form-card">
        <div class="form-card-header">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </span>
          <div class="form-card-title">
            <h2>What You're Looking For</h2>
            <p class="form-card-hint">
              Your preferences help us shape better recommendations.
            </p>
          </div>
        </div>

        <div class="field">
          <label>Opportunity types</label>
          <div class="pill-group" data-pill-group="preferredTypes">
            <button type="button" class="pill-toggle" data-value="Internship">Internship</button>
            <button type="button" class="pill-toggle" data-value="Job">Job</button>
            <button type="button" class="pill-toggle" data-value="Scholarship">Scholarship</button>
            <button type="button" class="pill-toggle" data-value="Hackathon">Hackathon</button>
            <button type="button" class="pill-toggle" data-value="Fellowship">Fellowship</button>
            <button type="button" class="pill-toggle" data-value="Training">Training</button>
            <button type="button" class="pill-toggle" data-value="Competition">Competition</button>
          </div>
        </div>

        <div class="field">
          <label>Preferred locations</label>
          <div class="pill-group" data-pill-group="preferredLocations">
            <button type="button" class="pill-toggle" data-value="Remote">Remote</button>
            <button type="button" class="pill-toggle" data-value="Ethiopia">Ethiopia</button>
            <button type="button" class="pill-toggle" data-value="Global">Global</button>
            <button type="button" class="pill-toggle" data-value="United States">United States</button>
            <button type="button" class="pill-toggle" data-value="Europe">Europe</button>
          </div>
        </div>

        <div class="field">
          <label>Preferred work mode</label>
          <div class="pill-group" data-pill-group="workMode">
            <button type="button" class="pill-toggle" data-value="Remote">Remote</button>
            <button type="button" class="pill-toggle" data-value="Hybrid">Hybrid</button>
            <button type="button" class="pill-toggle" data-value="On-site">On-site</button>
          </div>
        </div>
      </section>

      <!-- ============ 5. EXPERIENCE ============ -->
      <section class="form-card">
        <div class="form-card-header">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="20" height="14" rx="2"/>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
          </span>
          <h2>Experience</h2>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="experienceLevel">Experience level</label>
            <select id="experienceLevel" name="experienceLevel">
              <option value="">Select level</option>
              <option value="Beginner">Beginner</option>
              <option value="Intermediate">Intermediate</option>
              <option value="Advanced">Advanced</option>
            </select>
          </div>

          <div class="field">
            <label for="hoursPerWeek">Available hours per week</label>
            <div class="hours-wrap">
              <input id="hoursPerWeek" name="hoursPerWeek" type="number" min="0" max="40" value="10" />
              <span class="hours-unit">hrs</span>
            </div>
            <input id="hoursSlider" type="range" min="0" max="40" value="10" class="hours-slider" />
            <div class="slider-labels"><span>0</span><span>20</span><span>40+</span></div>
          </div>
        </div>
      </section>

    </form>
  </main>

  <!-- ============ STICKY FOOTER ============ -->
  <footer class="profile-footer">
    <div class="footer-actions">
      <button type="submit" form="profile-form" class="btn btn--primary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Save Profile
      </button>

      <button type="button" class="btn btn--ghost" id="cancelBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        Cancel
      </button>
    </div>

    <div class="save-status" id="saveStatus" aria-live="polite"></div>
  </footer>

  <script type="module" src="../javascript/profile.js"></script>
</body>
</html>
